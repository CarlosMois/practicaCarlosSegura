<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
 .primario {
    background-color: brown;

 }

 .secundario {
 background-color: blueviolet;
 }
</style>

</head>
<body>
    

    <button id="btn">Saludar</button>  
<div id="cajita" class="primario">Hola gente</div>
   

    <script>  

    let caja = document.getElementById("cajita");
caja.addEventListener("mouseover", color);



   let boton = document.getElementById("btn");

   boton.addEventListener("click", saludar);

function saludar() {
     alert("Saludito 🙌🤣🤣🤣🤣🤣🤣🤣🤣")
}

function color() {
    document.getElementById("cajita").classList.toggle("primario");
    document.getElementById("cajita").classList.toggle("secundario");
}


    </script>

</body>
</html>
