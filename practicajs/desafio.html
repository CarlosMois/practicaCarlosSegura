<body>
    <script>
     let numero1, numero2;
     
     numero1 = Number (prompt("Ingrese el primer numero para las operaciones basicas:"));
     numero2 = Number(prompt("Ingrese el segundo numero para las operaciones basicas:"));
     
     total = numero1 + numero2;
     total1= numero1 - numero2;
     total2= numero1 * numero2;
     total3= numero1/numero2;
     total4= numero1%numero2;
     document.write("La suma de los numeros es:" + total + "<br>");
     document.write("La resta de los numeros es:" + total1 + "<br>");
     document.write("La multiplicacion de los numeros es:" + total2 + "<br>");
     document.write("La division de los numeros es:" + total3 + "<br>");
     document.write("El residuo de los numeros es:" + total4 + "<br>");
     
     
     




    </script>
